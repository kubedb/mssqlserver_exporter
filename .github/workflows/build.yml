name: Go

on:
  push:
    branches:
     - master
  pull_request:
    branches:
     - master

jobs:
  build:
    if: ${{ !startsWith(github.event.head_commit.message, 'docs:') }}
    name: Build
    runs-on: ubuntu-latest
    steps:
    - name: Set up Go 1.x
      uses: actions/setup-go@v6
      with:
        go-version: '^1.24.0'
        check-latest: true
      id: go
    - name: Check out code into the Go module directory
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
    - name: Style
      run: make style
    - name: Vet
      run: make vet
    - name: Test
      run: make test
    - name: Build
      run: make build
