name: Go

on:
  push:
    branches:
     - master
  pull_request:
    branches:
     - master

jobs:
  label-detector:
    name: Runner Label
    runs-on: label-detector
    outputs:
      runs-on: ${{ steps.detector.outputs.label }}
    steps:
      - name: Detect Label
        id: detector
        run: |
          echo "label=$(curl -fsSL https://this-is-nats.appscode.ninja/runs-on/${{ github.repository_owner }}?visibility=${{ github.repository_visibility }})" >> $GITHUB_OUTPUT

  build:
    if: ${{ !startsWith(github.event.head_commit.message, 'docs:') }}
    name: Build
    needs: label-detector
    runs-on: "${{ needs.label-detector.outputs.runs-on }}"
    steps:
    - name: Set up Go 1.x
      uses: actions/setup-go@v6
      with:
        go-version: '^1.24.0'
        check-latest: true
      id: go
    - name: Check out code into the Go module directory
      uses: actions/checkout@v4
    - name: Style
      run: make style
    - name: Vet
      run: make vet
    - name: Test
      run: make test
    - name: Build
      run: make build
